name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-jar:
    name: Build runnable JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile and package JAR
        shell: bash
        run: |
          mkdir -p build/classes dist
          javac -encoding UTF-8 -d build/classes Main.java engine/*.java entity/*.java gui/*.java level/*.java model/*.java powerup/*.java tile/*.java util/*.java
          jar --create --file dist/BattleCity.jar --main-class Main -C build/classes . -C . resources

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleCity-jar
          path: dist/BattleCity.jar
          if-no-files-found: error

  build-native:
    name: Build ${{ matrix.name }} app image
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            runner: ubuntu-latest
          - name: Windows
            runner: windows-latest
          - name: macOS
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile and package JAR
        shell: bash
        run: |
          mkdir -p build/classes dist release
          javac -encoding UTF-8 -d build/classes Main.java engine/*.java entity/*.java gui/*.java level/*.java model/*.java powerup/*.java tile/*.java util/*.java
          jar --create --file dist/BattleCity.jar --main-class Main -C build/classes . -C . resources

      - name: Build native app image
        shell: bash
        run: |
          jpackage --type app-image --name BattleCity --input dist --main-jar BattleCity.jar --main-class Main --dest package

      - name: Archive Linux app image
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tar -czf release/BattleCity-linux.tar.gz -C package BattleCity

      - name: Archive Windows app image
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path package/BattleCity/* -DestinationPath release/BattleCity-windows.zip -Force

      - name: Archive macOS app image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent package/BattleCity.app release/BattleCity-macos.zip

      - name: Upload native artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleCity-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - build-jar
      - build-native

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          ls -la release-assets
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG_NAME" release-assets/* --repo "$GITHUB_REPOSITORY" --title "Battle City $TAG_NAME" --generate-notes
          fi
